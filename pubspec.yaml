name: flutter_hw_lototinder
description: Flutter project for hw number 1
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.3.0
  get_it: ^8.0.3
  objectbox: ^4.1.0
  objectbox_flutter_libs: any
  uuid: ^4.4.2
  path_provider: ^2.1.5
  mocktail: ^1.0.4
  freezed: ^2.5.7
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.15 
  objectbox_generator: any
  freezed_annotation: ^2.4.4
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/icons/dislike.svg
    - assets/icons/like.svg
    - assets/icons/dislike.png
    - assets/icons/like.png
    - assets/icons/cat.png
    - assets/icons/girl.png
    - assets/icons/boy.png
    - assets/Kototinder_icon.png

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Kototinder_icon.png"
